name: Rust pull request checks
on:
  pull_request:
    branches:
      - 'master'
      - 'prerelease/*'
    paths:
      - 'rules-rust/**'
      - '.github/workflows/rust-*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust checks (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [floor, pinned]
    defaults:
      run:
        working-directory: rules-rust
    steps:
      - uses: actions/checkout@v4
      - name: Select the floor toolchain
        if: matrix.leg == 'floor'
        run: |
          echo "RUSTUP_TOOLCHAIN=1.93.0" >> "$GITHUB_ENV"
          echo "KLIBS_RULES_EXPECT_TOOLCHAIN=1.93.0" >> "$GITHUB_ENV"
      - name: Select the pinned toolchain
        if: matrix.leg == 'pinned'
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          echo "KLIBS_RULES_EXPECT_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - name: Install the toolchain
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN:-$KLIBS_RULES_EXPECT_TOOLCHAIN}" --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (rule and suppression cases, both gate halves, the toolchain assertion)
        run: cargo test --workspace
      - name: Check out the documents
        if: matrix.leg == 'pinned'
        uses: actions/checkout@v4
        with:
          repository: Astra-Interactive/conf.ide
          path: conf.ide
      - name: Gate sync against the documents
        if: matrix.leg == 'pinned'
        run: cargo xtask gate-sync --docs "$GITHUB_WORKSPACE/conf.ide/.claude/docs" --check
