name: Rust gate drift
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

jobs:
  drift:
    name: Compare the gate with the documents
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-rust
    steps:
      - uses: actions/checkout@v4
      - name: Check out the documents
        uses: actions/checkout@v4
        with:
          repository: Astra-Interactive/conf.ide
          path: conf.ide
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Gate sync against the documents
        run: cargo xtask gate-sync --docs "$GITHUB_WORKSPACE/conf.ide/.claude/docs" --check
