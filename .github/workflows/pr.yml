name: Pull request checks
on:
  pull_request:
    branches:
      - 'master'
      - 'prerelease/*'


# Concurrency strategy:
#   github.workflow: distinguish this workflow from others
#   github.event_name: distinguish `push` event from `pull_request` event
#   github.ref_name: distinguish branch
#   github.repository: distinguish owner+repository
#
# Reference:
#   https://docs.github.com/en/actions/using-jobs/using-concurrency
#   https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      kotlin: ${{ steps.filter.outputs.kotlin }}
      rust: ${{ steps.filter.outputs.rust }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Detect changed projects
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            kotlin:
              - 'rules-kotlin/**'
            rust:
              - 'rules-rust/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
  gradle_validation:
    name: Validate Gradle wrapper
    needs: changes
    if: needs.changes.outputs.kotlin == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/call-gradle-wrapper-validation.yml
  version_changed:
    name: Validate version is changed
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    uses: ./.github/workflows/call-version-changed.yml
  detekt_validation:
    name: Detekt static analysis
    needs: gradle_validation
    uses: ./.github/workflows/call-detekt-validation.yml
  tests_validation:
    name: Tests
    needs: gradle_validation
    uses: ./.github/workflows/call-tests-validation.yml
  publish_validation:
    name: Validate publication
    needs: gradle_validation
    uses: ./.github/workflows/call-publish-validation.yml
    secrets:
      ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
      ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
      ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
      ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
      ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
  rust_validation:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/call-rust-validation.yml
  rust_version_changed:
    name: Validate Rust version is changed
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/call-rust-version-changed.yml
