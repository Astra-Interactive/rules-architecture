[workspace]
resolver = "3"
members = ["modules/rules", "xtask"]
exclude = ["cases"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/Astra-Interactive/rules-architecture"

[workspace.metadata.klibs-rules]
product-kind = "app"
entry-point-words = ["rule"]

[workspace.dependencies]
cargo_metadata = "0.23"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
sha2 = "0.10"
syn = { version = "3", features = ["full", "visit", "fold"] }
tempfile = "3"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(klibs_rules)"] }

[workspace.lints.clippy]
mod_module_files = "warn"
self_named_module_files = "warn"
let_underscore_must_use = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "warn"
redundant_closure_for_method_calls = "warn"
