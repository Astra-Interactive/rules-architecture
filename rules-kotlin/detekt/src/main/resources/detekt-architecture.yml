# Settings of detekt's own rules that enforce the architecture rules.
# List this file last in detekt's `config`: a later file overrides the values of an earlier one.
coroutines:
  # A DI module never reaches for a global singleton: scopes are constructed and passed in.
  GlobalCoroutineUsage:
    active: true
  # The no-callbacks rule: CancellationException is rethrown and cleanup that suspends runs in NonCancellable.
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
naming:
  # A package name is lowercase, one word per segment.
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
style:
  # Replaced by architecture.DeclarationOrder: the code-ordering rule puts init blocks after the functions they call.
  ClassOrdering:
    active: false
  # The model is data: a rule is an extension in util, a conversion to<Type> included.
  DataClassContainsFunctions:
    active: true
    conversionFunctionPrefix: [ ]
  DataClassShouldBeImmutable:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Forbidden FIXME todo marker in comment, please fix the problem.'
        value: 'FIXME:'
      - reason: 'Forbidden STOPSHIP todo marker in comment, please fix the problem.'
        value: 'STOPSHIP:'
      - reason: 'Forbidden TODO todo marker in comment, please fix the problem.'
        value: 'TODO:'
      - reason: 'Region markers are forbidden: use small functions and the file structure instead.'
        value: '^\s*(#?(end)?region(\s|$)|</?editor-fold)'
      - reason: 'Separator and section-header comments are forbidden: use small functions and the file structure instead.'
        value: '^\s*[-=*#~_]{3,}'
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'kotlinx.datetime.Instant'
        reason: 'Use kotlin.time.Instant.'
      - value: 'kotlinx.datetime.Clock'
        reason: 'Use kotlin.time.Clock.'
      - value: 'java.util.Date'
        reason: 'Use kotlin.time.Instant.'
      - value: 'kotlin.coroutines.suspendCoroutine'
        reason: 'Use suspendCancellableCoroutine: suspendCoroutine cannot be cancelled.'
      - value: 'kotlinx.coroutines.channels.trySendBlocking'
        reason: 'Use trySend from the callback: trySendBlocking blocks the library thread.'
      - value: 'java.util.Timer'
        reason: 'Launch a coroutine with delay instead of a Timer.'
      - value: 'java.util.TimerTask'
        reason: 'Launch a coroutine with delay instead of a TimerTask.'
      - value: 'android.os.Handler'
        reason: 'Launch a coroutine instead of posting to a Handler.'
      - value: 'kotlin.concurrent.thread'
        reason: 'Launch a coroutine instead of starting a thread.'
      - value: 'org.koin.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
      - value: 'org.kodein.di.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
      - value: 'dagger.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
      - value: 'com.squareup.anvil.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
      - value: 'dev.zacsweers.metro.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
      - value: 'me.tatarka.inject.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
      - value: 'software.amazon.lastmile.kotlin.inject.anvil.*'
        reason: 'Dependencies are injected by hand through constructors, without a DI framework.'
  # Executors only build a coroutine dispatcher in core (asCoroutineDispatcher()); test sources are not
  # application code.
  ForbiddenImport/executor:
    active: true
    includes: [ '**' ]
    excludes: [ '**/core/**', '**/test/**', '**/testFixtures/**', '**/*Test/**' ]
    forbiddenImports:
      - value: 'java.util.concurrent.Executor'
        reason: 'Use a coroutine dispatcher: an Executor is used only to build one in core.'
      - value: 'java.util.concurrent.Executors'
        reason: 'Use a coroutine dispatcher: Executors is used only to build one in core.'
  # A library's CompletableFuture is awaited in its technology package and never returned from project code.
  ForbiddenImport/future:
    active: true
    includes: [ '**' ]
    excludes:
      - '**/exposed/**'
      - '**/room/**'
      - '**/ktor/**'
      - '**/krate/**'
      - '**/sqldelight/**'
      - '**/datastore/**'
      - '**/retrofit/**'
      - '**/okhttp/**'
      - '**/test/**'
      - '**/testFixtures/**'
      - '**/*Test/**'
    forbiddenImports:
      - value: 'java.util.concurrent.CompletableFuture'
        reason: 'Return a suspend result: await the CompletableFuture in the technology package of its library.'
  # A composable reads a resource through asPainter() and asComposableString(), declared once in a util file.
  ForbiddenImport/resource:
    active: true
    includes: [ '**' ]
    excludes: [ '**/util/**' ]
    forbiddenImports:
      - value: 'org.jetbrains.compose.resources.painterResource'
        reason: 'Read the resource with DrawableResource.asPainter().'
      - value: 'org.jetbrains.compose.resources.stringResource'
        reason: 'Read the resource with StringResource.asComposableString().'
      - value: 'androidx.compose.ui.res.painterResource'
        reason: 'Read the resource with an asPainter() extension.'
      - value: 'androidx.compose.ui.res.stringResource'
        reason: 'Read the resource with an asComposableString() extension.'
  # androidx.compose.* is left out: the model of a Compose UI unit may carry Compose types.
  ForbiddenImport/model:
    active: true
    includes: [ '**/model/**' ]
    # A technology package keeps its own representation; any other model, under data included, is checked.
    excludes:
      - '**/exposed/**'
      - '**/room/**'
      - '**/ktor/**'
      - '**/krate/**'
      - '**/sqldelight/**'
      - '**/datastore/**'
      - '**/retrofit/**'
      - '**/okhttp/**'
      - '**/cache4k/**'
      - '**/file/**'
      - '**/memory/**'
      - '**/table/**'
      - '**/entity/**'
    forbiddenImports:
      - value: 'android.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.activity.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.appcompat.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.core.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.datastore.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.fragment.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.lifecycle.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.navigation.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.room.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.sqlite.*'
        reason: 'The model imports no platform type.'
      - value: 'androidx.work.*'
        reason: 'The model imports no platform type.'
      - value: 'io.ktor.*'
        reason: 'The model imports no framework type.'
      - value: 'io.papermc.*'
        reason: 'The model imports no platform type.'
      - value: 'net.fabricmc.*'
        reason: 'The model imports no platform type.'
      - value: 'net.minecraft.*'
        reason: 'The model imports no platform type.'
      - value: 'net.minecraftforge.*'
        reason: 'The model imports no platform type.'
      - value: 'net.neoforged.*'
        reason: 'The model imports no platform type.'
      - value: 'org.bukkit.*'
        reason: 'The model imports no platform type.'
      - value: 'org.jetbrains.exposed.*'
        reason: 'The model imports no ORM type: keep it in data/exposed.'
  ForbiddenImport/time:
    active: true
    includes: [ '**' ]
    excludes:
      - '**/exposed/**'
      - '**/room/**'
      - '**/ktor/**'
      - '**/krate/**'
      - '**/sqldelight/**'
      - '**/datastore/**'
      - '**/retrofit/**'
      - '**/okhttp/**'
      - '**/table/**'
      - '**/entity/**'
      - '**/contract/**'
    forbiddenImports:
      - value: 'java.time.Instant'
        reason: 'kotlin.time at the boundary only: use kotlin.time.Instant.'
      - value: 'java.time.Duration'
        reason: 'kotlin.time at the boundary only: use kotlin.time.Duration.'
      - value: 'java.time.LocalDateTime'
        reason: 'kotlin.time at the boundary only: use kotlin.time.Instant.'
      - value: 'java.util.Calendar'
        reason: 'kotlin.time at the boundary only: use kotlin.time.Instant.'
  # The Compose rule names a value in a val (`private val PreviewCanvasColor = Color(0xFF1F1F1F)`) and keeps a
  # value used once inline (`Modifier.size(28.dp)`).
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
  RedundantVisibilityModifier:
    active: true
  WildcardImport:
    active: true
    excludeImports: [ ]

ktlint:
  ImportOrdering:
    active: true
    layout: '*,java.**,javax.**,kotlin.**,^'
