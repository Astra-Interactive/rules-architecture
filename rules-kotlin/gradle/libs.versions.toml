[versions]
detekt = "2.0.0-alpha.6" # https://github.com/detekt/detekt - the version klibs-gradleplugin runs
klibs-gradleplugin = "2.8.0" # https://github.com/makeevrserg/gradle-plugin
konsist = "0.18.1" # https://github.com/LemonAppDev/konsist
kotlin-version = "2.4.10" # https://github.com/jetbrains/kotlin
kover = "0.9.11" # https://github.com/Kotlin/kotlinx-kover
tests-junit-bom = "6.1.3" # https://github.com/junit-team/junit5

[libraries]
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-core = { module = "dev.detekt:detekt-core", version.ref = "detekt" }
detekt-gradle = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-psi-utils = { module = "dev.detekt:detekt-psi-utils", version.ref = "detekt" }
detekt-rules-coroutines = { module = "dev.detekt:detekt-rules-coroutines", version.ref = "detekt" }
detekt-rules-style = { module = "dev.detekt:detekt-rules-style", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin-version" }
tests-junit-bom = { module = "org.junit:junit-bom", version.ref = "tests-junit-bom" }
tests-junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
tests-junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
tests-kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }

[plugins]
klibs-gradle-detekt = { id = "ru.astrainteractive.gradleplugin.detekt", version.ref = "klibs-gradleplugin" }
klibs-gradle-java-version = { id = "ru.astrainteractive.gradleplugin.java.version", version.ref = "klibs-gradleplugin" }
klibs-gradle-publication = { id = "ru.astrainteractive.gradleplugin.publication", version.ref = "klibs-gradleplugin" }
klibs-gradle-rootinfo = { id = "ru.astrainteractive.gradleplugin.rootinfo", version.ref = "klibs-gradleplugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
